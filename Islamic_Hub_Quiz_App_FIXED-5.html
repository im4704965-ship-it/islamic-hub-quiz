.heroIn{text-align:center;padding:42px 12px 34px}
.brand{font-size:clamp(38px,8vw,78px);letter-spacing:5px;color:#f3d58e;font-weight:bold;text-shadow:0 4px 15px #000}
.tag{font-family:Arial,sans-serif;letter-spacing:2px;font-size:clamp(12px,2.4vw,19px)}
.orn{color:var(--gold);font-size:25px;margin-top:12px}
.card{margin-top:20px;background:#071f20f5;border:1px solid #80683c66;border-radius:20px;padding:25px;box-shadow:0 12px 40px #0006}
.center{text-align:center}
h1{color:var(--gold);margin-top:0}
.note{font-family:Arial,sans-serif;color:var(--muted);line-height:1.6}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.level,.option,.small{border:1px solid #8c704066;border-radius:15px;background:linear-gradient(145deg,var(--panel2),#092121);color:var(--text);cursor:pointer}
.level{padding:23px 10px;min-height:145px}
.level:hover,.option:hover,.small:hover{border-color:var(--gold);transform:translateY(-2px)}
.level b{display:block;color:var(--gold);font-size:24px;margin-bottom:9px}
.level span{font:14px Arial,sans-serif;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.small{padding:10px 14px;font:14px Arial,sans-serif}
.yt{background:#8d2020;border-color:#c66}
a{text-decoration:none}
.meta{font:14px Arial,sans-serif;color:#cfc5ad;margin-top:18px}
.progress{height:8px;background:#183737;border-radius:20px;margin:10px 0 25px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#bb8b3b,#f0d386);transition:.2s}
.question{font-size:clamp(22px,4vw,33px);line-height:1.35;margin:18px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{padding:17px;text-align:left;font:16px Arial,sans-serif}
.option.correct{background:#17472e;border-color:#68c98c}
.option.wrong{background:#4b2424;border-color:#d47b7b}
.next{width:100%;margin-top:16px;padding:15px;border:0;border-radius:13px;background:#e2bd69;color:#102020;font-weight:bold;cursor:pointer;display:none}
.score{font-size:60px;color:var(--gold);font-weight:bold}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.hidden{display:none!important}
footer{text-align:center;color:#a99f88;font:13px Arial,sans-serif;padding:20px}
@media(max-width:650px){.levels,.options{grid-template-columns:1fr}.card{padding:18px 14px}.heroIn{padding:30px 8px}.brand{letter-spacing:2px}}
</style>

<section id="quiz" class="card hidden">
<div class="top">
<button id="homeBtn" class="small">← Levels</button>

</div>

</section>

</div>

<footer>Islamic Hub • Learn • Reflect • Share</footer>
</div>

<script>
(function(){
"use strict";
const DATA={"easy": [["How many obligatory prayers are there in a day?", ["3", "4", "5", "6"], 2], ["Which is the first Surah of the Qur'an?", ["Al-Baqarah", "Al-Fatihah", "Al-Ikhlas", "An-Nas"], 1], ["How many pillars of Islam are there?", ["3", "4", "5", "6"], 2], ["In which month do Muslims fast?", ["Muharram", "Rajab", "Ramadan", "Shawwal"], 2], ["What is the direction Muslims face during Salah called?", ["Qiblah", "Hijrah", "Miqat", "Khutbah"], 0], ["Which angel brought revelation to Prophet Muhammad ﷺ?", ["Mikail", "Israfil", "Jibril", "Malik"], 2], ["What is the obligatory charity on qualifying wealth called?", ["Sawm", "Zakah", "Hajj", "Adhan"], 1], ["How many times is Hajj obligatory for a Muslim who is able?", ["Every year", "Once in a lifetime", "Five times", "Twice"], 1], ["Where is the Ka'bah located?", ["Madinah", "Makkah", "Jerusalem", "Taif"], 1], ["What is the declaration of faith called?", ["Shahadah", "Sujood", "Tawaf", "Iftar"], 0], ["Which prayer is performed at dawn?", ["Maghrib", "Isha", "Fajr", "Asr"], 2], ["What is the meal eaten to break the fast at sunset called?", ["Suhoor", "Iftar", "Walima", "Aqiqah"], 1], ["Which Surah is called Umm al-Kitab?", ["Al-Fatihah", "Al-Kawthar", "Al-Masad", "Al-Falaq"], 0], ["What is the common Islamic greeting?", ["Good morning", "Assalamu Alaikum", "Welcome", "Good evening"], 1], ["What is the pilgrimage to Makkah called?", ["Hijrah", "Hajj", "Zakah", "Sawm"], 1]], "medium": [["How many Surahs are in the Qur'an?", ["110", "112", "114", "116"], 2], ["Which is the longest Surah in the Qur'an?", ["Al-Imran", "Al-Baqarah", "An-Nisa", "Al-Ma'idah"], 1], ["Which is the shortest Surah in the Qur'an?", ["Al-Asr", "Al-Kawthar", "Al-Ikhlas", "An-Nasr"], 1], ["To which city did the Prophet Muhammad ﷺ migrate?", ["Makkah", "Madinah", "Taif", "Jerusalem"], 1], ["What is the migration from Makkah to Madinah called?", ["Hijrah", "Isra", "Mi'raj", "Tawaf"], 0], ["Which battle took place in 2 AH?", ["Uhud", "Badr", "Khandaq", "Hunayn"], 1], ["Which daily prayer has four obligatory rak'ahs?", ["Fajr", "Maghrib", "Zuhr", "Witr"], 2], ["Which Surah begins with 'Alhamdu lillahi Rabbil 'alamin'?", ["Al-Fatihah", "Al-Baqarah", "Yasin", "Ar-Rahman"], 0], ["What is the night journey from Makkah to Jerusalem called?", ["Hijrah", "Isra", "Hajj", "Fath"], 1], ["Which mosque is the Prophet's Mosque?", ["The mosque in Makkah", "Al-Masjid an-Nabawi", "Al-Aqsa Mosque", "Quba Mosque"], 1], ["What is the pre-dawn meal during Ramadan called?", ["Iftar", "Suhoor", "Niyyah", "Sadaqah"], 1], ["Which month comes immediately after Ramadan?", ["Sha'ban", "Shawwal", "Dhul-Hijjah", "Muharram"], 1], ["What is voluntary charity commonly called?", ["Sadaqah", "Sawm", "Salah", "Tawaf"], 0], ["Which prophet built the Ka'bah with his son Ismail عليهما السلام?", ["Nuh", "Ibrahim", "Musa", "Yusuf"], 1], ["Which Surah contains Ayat al-Kursi?", ["Al-Baqarah", "Al-Kahf", "Yasin", "Al-Mulk"], 0]], "hard": [["Approximately how many years did the Prophet Muhammad ﷺ preach in Makkah after the first revelation?", ["5", "10", "13", "20"], 2], ["Approximately how many years did the Prophet Muhammad ﷺ live in Madinah after the Hijrah?", ["5", "8", "10", "15"], 2], ["Which Surah contains the command about fasting Ramadan?", ["Al-Baqarah", "Al-Ma'idah", "At-Tawbah", "An-Nahl"], 0], ["Which Surah is popularly known as 'the heart of the Qur'an'?", ["Yasin", "Al-Mulk", "Al-Waqi'ah", "Ar-Rahman"], 0], ["Which battle is also known as the Battle of the Trench?", ["Badr", "Uhud", "Al-Ahzab", "Hunayn"], 2], ["Which treaty was made between the Muslims and Quraysh in 6 AH?", ["Treaty of Aqabah", "Treaty of Hudaybiyyah", "Constitution of Madinah", "Treaty of Najran"], 1], ["Who was the first caliph after Prophet Muhammad ﷺ?", ["Umar ibn al-Khattab", "Uthman ibn Affan", "Ali ibn Abi Talib", "Abu Bakr as-Siddiq"], 3], ["Which companion was known by the title Al-Faruq?", ["Abu Bakr", "Umar ibn al-Khattab", "Uthman ibn Affan", "Ali ibn Abi Talib"], 1], ["Which caliph is associated with standardizing and distributing copies of the Qur'an?", ["Abu Bakr", "Umar", "Uthman", "Ali"], 2], ["Which prophet was given the Zabur?", ["Dawud", "Sulaiman", "Musa", "Isa"], 0], ["Which prophet was given the Tawrat?", ["Ibrahim", "Musa", "Isa", "Yunus"], 1], ["Which prophet was given the Injil?", ["Musa", "Dawud", "Isa", "Nuh"], 2], ["Which Surah does not begin with Bismillah in the standard Qur'an text?", ["At-Tawbah", "Al-Anfal", "Al-Fath", "Al-Hashr"], 0], ["How many obligatory rak'ahs are there in the five daily prayers altogether?", ["15", "17", "19", "20"], 1], ["Which two hills are associated with Sa'i?", ["Arafat and Muzdalifah", "Safa and Marwah", "Uhud and Hira", "Sina and Safa"], 1]]};
let level="";
let index=0;
let points=0;
let locked=false;

const home=document.getElementById("home");
const quiz=document.getElementById("quiz");
const result=document.getElementById("result");
const qText=document.getElementById("question");
const options=document.getElementById("options");
const next=document.getElementById("next");
const bar=document.getElementById("bar");
const qNumber=document.getElementById("qNumber");
const qTotal=document.getElementById("qTotal");
const levelTitle=document.getElementById("levelTitle");
const score=document.getElementById("score");
const resultText=document.getElementById("resultText");

document.querySelectorAll(".level").forEach(function(btn){
  btn.addEventListener("click",function(){ start(btn.dataset.level); });
});
document.getElementById("homeBtn").addEventListener("click",showHome);
document.getElementById("choose").addEventListener("click",showHome);
document.getElementById("retry").addEventListener("click",function(){start(level);});
next.addEventListener("click",goNext);

function start(which){
  level=which; index=0; points=0; locked=false;
  home.classList.add("hidden"); result.classList.add("hidden"); quiz.classList.remove("hidden");
  levelTitle.textContent=which.charAt(0).toUpperCase()+which.slice(1);
  qTotal.textContent=DATA[level].length;
  render();
  window.scrollTo(0,0);
}

function render(){
  locked=false;
  const item=DATA[level][index];
  qNumber.textContent=index+1;
  qText.textContent=item[0];
  bar.style.width=(index/DATA[level].length*100)+"%";
  options.innerHTML="";
  next.style.display="none";
  item[1].forEach(function(answer,i){
    const b=document.createElement("button");
    b.className="option";
    b.type="button";
    b.innerHTML="<b>"+String.fromCharCode(65+i)+".</b> "+answer;
    b.addEventListener("click",function(){choose(i,b);});
    options.appendChild(b);
  });
}

function choose(choice,clicked){
  if(locked) return;
  locked=true;
  const item=DATA[level][index];
  const buttons=options.querySelectorAll("button");
  buttons.forEach(function(b,i){
    b.disabled=true;
    if(i===item[2]) b.classList.add("correct");
  });
  if(choice===item[2]) points++;
  else clicked.classList.add("wrong");
  bar.style.width=((index+1)/DATA[level].length*100)+"%";
  next.textContent=index===DATA[level].length-1?"See Results":"Next Question →";
  next.style.display="block";
}

function goNext(){
  if(!locked) return;
  if(index<DATA[level].length-1){index++;render();}
  else showResult();
}

function showResult(){
  quiz.classList.add("hidden"); result.classList.remove("hidden");
  const total=DATA[level].length;
  const percent=Math.round(points/total*100);
  score.textContent=points+" / "+total;
  resultText.textContent="Your score is "+percent+"%. "+(percent>=80?"Excellent work! Keep learning.":percent>=60?"Good effort! Keep revising and try again.":"Keep practicing—every question is a chance to learn.");
  window.scrollTo(0,0);
}

function showHome(){
  quiz.classList.add("hidden"); result.classList.add("hidden"); home.classList.remove("hidden");
  window.scrollTo(0,0);
}
})();
</script>
</body>
</html>
